services:
  askai-web:
    build: .
    image: askai-web:latest
    container_name: askai-web
    restart: unless-stopped

    ports:
      # VM host 17000 -> nginx 8080 in the container.
      - "17000:8080"

    environment:
      # The v2 API on the VM host's published port (18000).
      #
      # This default deliberately does not depend on the API's container name or
      # network: host.docker.internal always resolves from /etc/hosts, so nginx
      # always starts, and an API that is down is a 502 on /api rather than a
      # frontend that refuses connections.
      #
      # To go over a shared network instead — tidier, but the frontend then
      # fails to start while the API is absent:
      #   API_UPSTREAM=http://<api-service-name>:8000 docker compose ... up -d
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:18000}

      # Asserted on every proxied request, server-side.
      CALLER_ID: ${CALLER_ID:-askai-web}

    # What makes host.docker.internal resolve to the VM host on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - kap_shared_network

networks:
  kap_shared_network:
    # Created outside this file.
    external: true
